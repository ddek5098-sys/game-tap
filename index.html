<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Tap Cepat</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      text-align: center;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    #gameArea {
      position: relative;
      width: 100%;
      height: 60vh;
      min-height: 320px;
      max-height: 500px;
      background: linear-gradient(180deg, #334155, #0f172a);
      border: 2px solid #475569;
      border-radius: 16px;
      overflow: hidden;
    }

    #target {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      box-shadow: 0 8px 16px rgba(244,63,94,0.45);
      display: none;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 12px;
      color: #cbd5e1;
    }

    .small {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Game Tap Cepat</h1>

    <div class="info">
      <div>Skor: <span id="score">0</span></div>
      <div>Waktu: <span id="time">20</span> dtk</div>
    </div>

    <div id="gameArea">
      <div id="target"></div>
    </div>

    <button id="startBtn">Mulai Game</button>
    <div id="message">Tekan tombol lalu tap lingkaran merah secepat mungkin.</div>
    <div class="small">Cocok dimainkan di Chrome Android</div>
  </div>

  <script>
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const target = document.getElementById("target");
    const gameArea = document.getElementById("gameArea");
    const startBtn = document.getElementById("startBtn");
    const message = document.getElementById("message");

    let score = 0;
    let timeLeft = 20;
    let timer = null;
    let playing = false;

    function moveTarget() {
      const size = Math.floor(Math.random() * 35) + 55;
      target.style.width = size + "px";
      target.style.height = size + "px";

      const maxX = gameArea.clientWidth - size;
      const maxY = gameArea.clientHeight - size;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    function startGame() {
      if (playing) return;

      score = 0;
      timeLeft = 20;
      playing = true;

      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      message.textContent = "Ayo! Tap lingkarannya!";
      startBtn.textContent = "Game Berjalan...";
      startBtn.disabled = true;

      target.style.display = "block";
      moveTarget();

      timer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(timer);
      playing = false;
      target.style.display = "none";
      startBtn.disabled = false;
      startBtn.textContent = "Main Lagi";
      message.textContent = "Waktu habis! Skor kamu: " + score;
    }

    function hitTarget(e) {
      if (!playing) return;
      e.preventDefault();
      score++;
      scoreEl.textContent = score;
      moveTarget();
    }

    target.addEventListener("click", hitTarget);
    target.addEventListener("touchstart", hitTarget, { passive: false });
    startBtn.addEventListener("click", startGame);
  </script>
</body>
  </html>
